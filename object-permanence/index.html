<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Object Permanence</title>
<style>
  :root { --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; --ink: #e9e6df; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #000; color: var(--ink); overflow: hidden;
               font-family: var(--serif); -webkit-tap-highlight-color: transparent; }

  /* ---------- stage ---------- */
  #stage { position: fixed; inset: 0; background: #000; cursor: pointer; touch-action: manipulation; }
  .ph, #mv { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain;
             background: #000; opacity: 0; transition: opacity 1400ms ease; }
  #mv { transition-duration: 0ms; }

  /* ---------- caption ---------- */
  #cap { position: fixed; left: 0; right: 0; bottom: max(20px, env(safe-area-inset-bottom));
         text-align: center; padding: 0 16px; font-size: clamp(12px, 1.5vw, 15px); letter-spacing: .06em;
         color: rgba(240,236,228,.86); text-shadow: 0 1px 8px #000, 0 0 3px #000;
         opacity: 0; transition: opacity 700ms ease; pointer-events: none; }

  /* ---------- gate ---------- */
  #gate { position: fixed; inset: 0; background: #000; display: flex; flex-direction: column;
          align-items: center; justify-content: center; gap: 18px; text-align: center; padding: 24px;
          transition: opacity 1400ms ease; z-index: 20; cursor: default; }
  #gate h1 { font-weight: 400; font-size: clamp(18px, 3.2vw, 30px); letter-spacing: .34em; text-transform: uppercase; padding-left: .34em; }
  #gate p { font-size: 12px; letter-spacing: .24em; text-transform: uppercase; color: rgba(233,230,223,.55); }
  #gate.ready { cursor: pointer; }
  #gate.ready p { color: rgba(233,230,223,.8); }
  #gate.go { opacity: 0; pointer-events: none; }

  /* ---------- small controls ---------- */
  #mute { position: fixed; top: max(14px, env(safe-area-inset-top)); right: 16px; z-index: 10; background: none; border: 0;
          color: rgba(233,230,223,.5); font: inherit; font-size: 12px; letter-spacing: .2em; text-transform: uppercase;
          padding: 8px; cursor: pointer; opacity: 0; transition: opacity 1200ms ease; }
  #mute.show { opacity: 1; } #mute:hover, #mute:focus-visible { color: rgba(233,230,223,.95); }
  #hint { position: fixed; right: 18px; top: 50%; transform: translateY(-50%); font-size: 30px; color: rgba(233,230,223,.7);
          opacity: 0; pointer-events: none; text-shadow: 0 0 8px #000; }
  #hint.go { animation: hint 6s ease 1s 1 both; }
  @keyframes hint { 0%{opacity:0} 25%{opacity:.8} 75%{opacity:.8} 100%{opacity:0} }
  #again { position: fixed; left: 0; right: 0; bottom: 28px; text-align: center; opacity: 0; transition: opacity 2000ms ease; pointer-events: none; }
  #again.show { opacity: 1; pointer-events: auto; }
  #again a { color: rgba(233,230,223,.45); font-size: 12px; letter-spacing: .24em; text-transform: uppercase; text-decoration: none; cursor: pointer; padding: 10px; }
  #again a:hover { color: rgba(233,230,223,.9); }

  /* ---------- mixer (press M) ---------- */
  #mix { position: fixed; right: 12px; bottom: 12px; width: min(340px, calc(100vw - 24px)); max-height: calc(100vh - 24px); overflow: auto;
         background: rgba(12,12,12,.94); border: 1px solid #333; border-radius: 6px; padding: 12px 14px; z-index: 30; display: none;
         font: 12px/1.3 system-ui, sans-serif; color: #ddd; cursor: default; }
  #mix.open { display: block; }
  #mix h2 { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 8px; color: #fff; }
  #mix .row { display: grid; grid-template-columns: 78px 1fr 46px; align-items: center; gap: 8px; margin: 5px 0; }
  #mix input[type=range] { width: 100%; }
  #mix .db { text-align: right; font-variant-numeric: tabular-nums; color: #aaa; }
  #mix select, #mix button { font: inherit; background: #222; color: #ddd; border: 1px solid #444; border-radius: 4px; padding: 5px 8px; cursor: pointer; }
  #mix .bar { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  #mix small { display: block; color: #888; margin-top: 8px; }
  #mix hr { border: 0; border-top: 1px solid #333; margin: 10px 0; }
</style>
</head>
<body>

<div id="stage" role="img" aria-label="Object Permanence">
  <img class="ph" id="p0" alt="" decoding="async">
  <img class="ph" id="p1" alt="" decoding="async">
  <video id="mv" muted loop playsinline preload="auto" aria-label="Flea market film footage"></video>
</div>
<div id="cap" aria-live="polite"></div>
<div id="hint" aria-hidden="true">›</div>
<button id="mute" type="button">Sound on</button>
<div id="again"><a href="" id="againLink">Again</a></div>

<div id="gate" class="loading">
  <h1>Object Permanence</h1>
  <p id="gateMsg">Loading</p>
</div>

<div id="mix" aria-label="Mixer"></div>

<noscript><p style="position:fixed;inset:0;display:grid;place-items:center;color:#aaa;background:#000">This piece needs JavaScript and sound.</p></noscript>

<script>
"use strict";
/* ====================================================================
   OBJECT PERMANENCE — Liala Layther
   Everything you are likely to edit is in the two tables below.
   ==================================================================== */

/* ---- 1. SOUNDS ------------------------------------------------------
   kind "bed"   = a continuous sound that is switched on and off by the sequence
   kind "layer" = an apartment sound. It arrives with its photo, then sinks
                  (a little quieter every time a new sound arrives) but never
                  disappears, until the market cuts everything.
   kind "once"  = plays one time.
   how  "stream" = long files, played straight from the file (low memory)
   how  "buffer" = short files, loaded into memory
   trim = level in dB. 0 = your file exactly as you made it.
          Change these here, or press M on the page to tune by ear.        */
const SOUNDS = {
  room:   { src: "audio/room_tone.mp3",             kind: "bed",   how: "stream", trim:  0 },
  street: { src: "audio/street_through_window.mp3", kind: "bed",   how: "stream", trim: -8 },
  market: { src: "audio/flea_market.mp3",           kind: "bed",   how: "stream", trim:  0 },
  door:   { src: "audio/door_opening.mp3",          kind: "once",  how: "buffer", trim:  0 },
  dishes: { src: "audio/setting_down_dishes.mp3",   kind: "layer", how: "buffer", trim:  0 },
  fabric: { src: "audio/fabric_moving.mp3",         kind: "layer", how: "buffer", trim:  0 },
  bulbs:  { src: "audio/glass_bulbs.mp3",           kind: "layer", how: "buffer", trim:  0 },
  hangers:{ src: "audio/hangers.mp3",               kind: "layer", how: "buffer", trim:  0 },
  pages:  { src: "audio/book_flipping.mp3",         kind: "layer", how: "stream", trim:  0 },
  tap:    { src: "audio/tap_on.mp3",                kind: "layer", how: "buffer", trim:  0 }
};
const LABELS = { room:"Room tone", street:"Street", market:"Market", door:"Door", dishes:"Dishes", fabric:"Fabric",
                 bulbs:"Bulbs", hangers:"Hangers", pages:"Pages", tap:"Tap" };

/* How far each apartment sound sinks (dB) as newer ones arrive:
   newest, then each older one. The last number is the floor — it never goes below it. */
const SINK = [0, -5, -9, -13, -17];

/* ---- 2. THE SEQUENCE ------------------------------------------------
   Reorder, add or delete steps here. One step = one click.
   img      photo path (or a list: the first one that exists is used)
   video    a muted looping film clip instead of a photo
   cap      caption shown in brackets (also the accessible description of the sound)
   add      the sound that arrives with this step
   once     a sound played one time on arrival
   market   true = the hard cut: every apartment sound stops, the market starts, no way back
   marketOut true = the market sound fades out here
   end      true = the final black
   fade     photo crossfade in milliseconds (default 1400)                     */
const STEPS = [
  { gate: true },
  { img: "photos/hall.jpg",      alt: "A white hallway. Through an open door, a crowded back room and pinned photographs.", cap: "[a door opening]", once: "door" },
  { img: "photos/wide_room.jpg", alt: "A wide living room with an arched doorway, a green rug, a child's tricycle and a wheelchair in the back.", cap: "[a quiet room]" },
  { img: "photos/dolls.jpg",     alt: "Dolls and figurines gathered on a loveseat in window light.", cap: "[the street, through a window]", add: "street" },
  { img: "photos/kitchen.jpg",   alt: "A green kitchen wall hung with pans above a white stove." },
  { img: "photos/cabinet.jpg",   alt: "A yellow cabinet of stacked blue and white dishes.", cap: "[dishes, set down]", add: "dishes" },
  { img: "photos/kimono.jpg",    alt: "A patterned maroon robe laid out, a hand resting on it.", cap: "[fabric moving]", add: "fabric" },
  { img: "photos/bulbs.jpg",     alt: "A file cabinet with a drawer of papers open and a basket of light bulbs on top.", cap: "[glass bulbs]", add: "bulbs" },
  { img: "photos/closet.jpg",    alt: "A closet crowded with hanging clothes and bags.", cap: "[hangers]", add: "hangers" },
  { img: "photos/storage.jpg",   alt: "A narrow storage closet with shelves of boxes." },
  { img: "photos/books.jpg",     alt: "A wall of bookshelves, a dark room behind it.", cap: "[pages turning]", add: "pages" },
  { img: "photos/bathroom.jpg",  alt: "A white bathroom sink under a mirror, crowded with bottles.", cap: "[water running]", add: "tap" },
  { img: "photos/bike_hall.jpg", alt: "A yellow hallway with a bicycle standing by a door." },

  /* ---- the hard cut ---- */
  { video: ["video/flea_market.mp4", "video/flea_market.webm"], cap: "[a flea market]", market: true, fade: 0 },
  { img: "photos/market_1.jpg",  alt: "A man in a hat browsing a market table of brass figures.", fade: 0 },
  { img: "photos/market_2.jpg",  alt: "A market table of cut-glass decanters and silver trays.", fade: 0 },
  { img: "photos/market_3.jpg",  alt: "A glass display case of small jewellery at a flea market.", fade: 0 },

  /* ---- the return: the same room. Put your emptied version at photos/wide_room_empty.jpg ---- */
  { img: ["photos/wide_room_empty.jpg", "photos/wide_room.jpg"], alt: "The wide living room again.", marketOut: true, fade: 2600 },
  { end: true }
];

/* ---- 3. ENDING ------------------------------------------------------
   Default: the street fades out over black.
   Add  ?ending=room  to the web address to hear the other one: the room tone returns over black. */
const ENDING = new URLSearchParams(location.search).get("ending") === "room" ? "room" : "street";

/* ==================================================================== */
const $  = s => document.querySelector(s);
const db2g = d => Math.pow(10, d / 20);
const IDX = {
  market: STEPS.findIndex(s => s.market),
  out:    STEPS.findIndex(s => s.marketOut),
  end:    STEPS.findIndex(s => s.end),
  street: STEPS.findIndex(s => s.add === "street")
};

/* ---------- audio engine ---------- */
let ctx, master, comp, analyser, muted = false, ready = false;
const bus = {}, snd = {}, lastTarget = {};
const trimDB = { master: 0 };
for (const k in SOUNDS) trimDB[k] = SOUNDS[k].trim;
try { Object.assign(trimDB, JSON.parse(localStorage.getItem("op_mix") || "{}")); } catch (e) {}

const N = 96, CIN = new Float32Array(N), COUT = new Float32Array(N);       // equal-power crossfade curves
for (let i = 0; i < N; i++) { const x = i / (N - 1) * Math.PI / 2; CIN[i] = Math.sin(x); COUT[i] = Math.cos(x); }

function applyMaster() {
  if (!master) return;
  const g = muted ? 0 : 0.9 * db2g(trimDB.master || 0);
  master.gain.setTargetAtTime(g, ctx.currentTime, 0.08);
}
function audioSetup() {
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return false;
  ctx = new AC();
  master = ctx.createGain(); master.gain.value = 0.9 * db2g(trimDB.master || 0);
  comp = ctx.createDynamicsCompressor();                       // safety limiter only: stacked layers can't clip
  comp.threshold.value = -3; comp.knee.value = 0; comp.ratio.value = 20; comp.attack.value = 0.003; comp.release.value = 0.25;
  analyser = ctx.createAnalyser(); analyser.fftSize = 2048;
  master.connect(comp); comp.connect(ctx.destination); comp.connect(analyser);
  for (const k in SOUNDS) {
    const level = ctx.createGain(); level.gain.value = 0;
    const trim = ctx.createGain(); trim.gain.value = db2g(trimDB[k]);
    level.connect(trim); trim.connect(master);
    bus[k] = { level, trim };
  }
  return true;
}
function decode(ab) {
  return new Promise((res, rej) => { const p = ctx.decodeAudioData(ab, res, rej); if (p && p.catch) p.catch(rej); });
}

/* a loop made of overlapping copies, so the join never clicks */
function startBufferLoop(buf, dest, xf) {
  const dur = buf.duration; xf = Math.min(xf, dur / 4);
  let t = ctx.currentTime + 0.03, first = true;
  function schedule() {
    const src = ctx.createBufferSource(); src.buffer = buf;
    const g = ctx.createGain(); src.connect(g); g.connect(dest);
    const fi = first ? 0.02 : xf; first = false;
    g.gain.setValueAtTime(0, t);
    g.gain.setValueCurveAtTime(CIN, t, fi);
    g.gain.setValueCurveAtTime(COUT, t + dur - xf, xf);
    src.start(t); src.stop(t + dur + 0.05);
    t += dur - xf;
  }
  const pump = () => { while (t - ctx.currentTime < 3) schedule(); };
  pump(); const timer = setInterval(pump, 500);
  return () => clearInterval(timer);
}

/* long files are played straight from the file; two copies hand over to each other at the end */
function makeStream(src, dest, xf) {
  const mk = now => {
    const a = new Audio(); a.preload = now ? "auto" : "none"; a.playsInline = true; if (now) a.src = src;
    const s = ctx.createMediaElementSource(a), g = ctx.createGain(); g.gain.value = 0;
    s.connect(g); g.connect(dest); return { a, g, primed: !!now };
  };
  let A = mk(true), B = mk(false), running = false, handing = false, timer = null;
  A.g.gain.value = 1;
  const prime = e => { if (!e.primed) { e.a.src = src; e.a.preload = "auto"; e.a.load(); e.primed = true; } };
  function handoff(len) {
    if (handing) return; handing = true; prime(B);
    const t = ctx.currentTime, n = B, o = A;
    try { n.a.currentTime = 0; } catch (e) {}
    const p = n.a.play(); if (p && p.catch) p.catch(() => {});
    n.g.gain.setValueCurveAtTime(CIN, t, len); o.g.gain.setValueCurveAtTime(COUT, t, len);
    setTimeout(() => { o.a.pause(); try { o.a.currentTime = 0; } catch (e) {} A = n; B = o; handing = false; }, len * 1000 + 150);
  }
  function tick() {
    if (!running || handing) return;
    const d = A.a.duration; if (!isFinite(d) || d <= 0) return;
    const rem = d - A.a.currentTime;
    if (rem < 30) prime(B);
    if (rem <= Math.min(xf, d / 4) + 0.3) handoff(Math.min(xf, d / 4));
  }
  [A, B].forEach(e => e.a.addEventListener("ended", () => { if (running && !handing && e === A) handoff(0.05); }));
  const play = () => { try { A.a.currentTime = 0; } catch (e) {} const p = A.a.play(); if (p && p.catch) p.catch(() => {}); running = true; timer = timer || setInterval(tick, 200); };
  return { start: play, unlock() { const p = A.a.play(); A.a.pause(); if (p && p.catch) p.catch(() => {}); } };
}

async function loadSounds() {
  await Promise.all(Object.keys(SOUNDS).map(async k => {
    const d = SOUNDS[k]; const s = snd[k] = { started: false };
    try {
      if (d.how === "buffer") {
        const r = await fetch(d.src); if (!r.ok) throw new Error(r.status);
        s.buf = await decode(await r.arrayBuffer());
      } else {
        s.stream = makeStream(d.src, bus[k].level, 2.5);
      }
    } catch (e) { console.warn("sound missing, skipped:", d.src, e); s.missing = true; }
  }));
}
function ensureStarted(k) {
  const s = snd[k]; if (!s || s.started || s.missing) return;
  s.started = true;
  if (s.stream) s.stream.start(); else if (s.buf) startBufferLoop(s.buf, bus[k].level, 0.25);
}
function playOnce(k) {
  const s = snd[k]; if (!s || !s.buf) return;
  const src = ctx.createBufferSource(); src.buffer = s.buf; src.connect(bus[k].level);
  bus[k].level.gain.cancelScheduledValues(ctx.currentTime); bus[k].level.gain.setValueAtTime(1, ctx.currentTime);
  src.start();
}

function setLevel(k, dB, ramp) {
  if (!bus[k] || lastTarget[k] === dB) return;
  lastTarget[k] = dB;
  const p = bus[k].level.gain, now = ctx.currentTime, g = dB === null ? 0 : db2g(dB);
  if (dB !== null) ensureStarted(k);
  if (p.cancelAndHoldAtTime) p.cancelAndHoldAtTime(now); else { p.cancelScheduledValues(now); p.setValueAtTime(p.value, now); }
  if (ramp <= 0.05) { p.linearRampToValueAtTime(g, now + Math.max(ramp, 0.01)); return; }
  p.setTargetAtTime(g, now, ramp / 3);
  if (dB === null) p.setValueAtTime(0, now + ramp * 1.8);
}

/* what should every sound be doing at step i? (dB, or null = silent) */
function targets(i) {
  const t = {};
  const apt = i >= 1 && i < IDX.market;
  t.room = apt ? 0 : (ENDING === "room" && i === IDX.end ? 0 : null);
  t.street = i < IDX.street ? null : (i === IDX.end ? (ENDING === "room" ? -18 : null) : 0);
  t.market = (i >= IDX.market && i < IDX.out) ? 0 : null;
  const arrived = [];
  STEPS.forEach((s, k) => { if (s.add && SOUNDS[s.add].kind === "layer" && k <= i && k < IDX.market) arrived.push({ k, key: s.add }); });
  for (const key in SOUNDS) if (SOUNDS[key].kind === "layer") t[key] = null;
  // The newest sound is full level while its photo is up. Every time a newer sound arrives,
  // or the photo moves on without one, everything older drops one notch.
  const moved = arrived.length && arrived[arrived.length - 1].k < i ? 1 : 0;
  if (i < IDX.market) arrived.forEach((o, n) => {
    const rank = (arrived.length - 1 - n) + moved;
    t[o.key] = SINK[Math.min(rank, SINK.length - 1)];
  });
  return t;
}
function rampFor(k, i, prev) {
  if (i === IDX.market && prev < i) return 0.03;                 // the hard cut
  if (i === IDX.end) return 12;
  if (i === IDX.out) return k === "market" ? 3 : 2.5;
  if (k === "room" && prev === 0) return 12;                     // the room comes up slowly
  if (k === "street" && STEPS[i].add === "street") return 5;
  return 2.5;
}
function applyAudio(i, prev) {
  if (!ctx) return;
  const t = targets(i);
  for (const k in SOUNDS) { if (SOUNDS[k].kind === "once") continue; setLevel(k, k in t ? t[k] : null, rampFor(k, i, prev)); }
  if (STEPS[i].once && i > prev) playOnce(STEPS[i].once);
}

/* ---------- pictures ---------- */
const slots = [$("#p0"), $("#p1")], mv = $("#mv"), cap = $("#cap");
let front = 0, cur = 0, token = 0, lastNav = 0;
const keep = [];
const seen = new Map();
function loadable(src) {
  if (!seen.has(src)) seen.set(src, new Promise(res => { const im = new Image(); im.onload = () => res(true); im.onerror = () => res(false); im.src = src; keep.push(im); }));
  return seen.get(src);
}
/* a film can be listed in more than one format; the first one this browser can play is used */
function pickVideo(list) {
  const v = document.createElement("video"), types = { mp4: 'video/mp4; codecs="avc1.42E01E"', webm: 'video/webm; codecs="vp9"' };
  const l = [].concat(list);
  return l.find(s => v.canPlayType(types[s.split(".").pop()] || "")) || l[0];
}
async function firstLoadable(list) {
  for (const s of [].concat(list)) if (await loadable(s)) return s;
  console.warn("no image could be loaded from", list); return null;
}
function preload(i) { const s = STEPS[i]; if (s && s.img) firstLoadable(s.img); }

async function showStep(i) {
  const s = STEPS[i], my = ++token, fade = s.fade == null ? 1400 : s.fade;
  setCaption(s.cap || "");
  const fadeOut = el => { el.style.transitionDuration = fade + "ms"; el.style.opacity = 0; };
  if (s.video) {
    slots.forEach(e => { e.style.transitionDuration = "0ms"; e.style.opacity = 0; });
    if (!mv.getAttribute("src")) mv.src = pickVideo(s.video);
    try { mv.currentTime = 0; } catch (e) {}
    const p = mv.play(); if (p && p.catch) p.catch(() => {});
    mv.style.opacity = 1;
  } else {
    if (mv.style.opacity !== "0") { mv.style.opacity = 0; mv.pause(); }
    if (s.img) {
      const src = await firstLoadable(s.img); if (my !== token) return;
      const back = slots[1 - front], old = slots[front];
      back.alt = s.alt || ""; back.src = src;
      try { await back.decode(); } catch (e) {}
      if (my !== token) return;
      back.style.transitionDuration = fade + "ms"; back.style.opacity = 1; fadeOut(old); front = 1 - front;
    } else { slots.forEach(fadeOut); }
  }
  preload(i + 1); preload(i + 2);
}
let capTimer;
function setCaption(text) {
  clearTimeout(capTimer); cap.style.opacity = 0;
  capTimer = setTimeout(() => { cap.textContent = text; if (text) cap.style.opacity = 1; }, 450);
}

/* ---------- moving through it ---------- */
function go(i, force) {
  if (!ready || i < 0 || i >= STEPS.length || i === cur) return;
  if (!force && (i < 1 || (i < cur && cur >= IDX.market))) return;   // never back to the gate; no way back from the market on
  const prev = cur; cur = i;
  showStep(i); applyAudio(i, prev);
  if (i === 2 || i === IDX.end) $("#hint").classList.remove("go");
  if (i === 1) { const h = $("#hint"); h.classList.remove("go"); void h.offsetWidth; h.classList.add("go"); }
  if (i === IDX.end) setTimeout(() => $("#again").classList.add("show"), 15000);
  syncMixer();
}
function nav(d, force) {
  const now = performance.now(); if (!force && now - lastNav < 350) return; lastNav = now;
  go(cur + d, force);
}

/* ---------- gate ---------- */
async function boot() {
  const gate = $("#gate"), msg = $("#gateMsg");
  if (!audioSetup()) { msg.textContent = "This browser can't play the sound"; return; }
  const imgs = Promise.all([STEPS[1].img, STEPS[2].img, STEPS[3].img].map(firstLoadable));
  await Promise.race([Promise.all([loadSounds(), imgs]), new Promise(r => setTimeout(r, 12000))]);
  ready = true; gate.classList.add("ready"); msg.textContent = "Headphones. Click to enter.";
  if (IDX.market >= 0 && STEPS[IDX.market].video) { mv.src = pickVideo(STEPS[IDX.market].video); }   // start fetching the film now
  buildMixer();
  const enter = async () => {
    if (!gate.classList.contains("ready") || gate.classList.contains("go")) return;
    try { await ctx.resume(); } catch (e) {}
    for (const k of ["street", "pages", "market"]) if (snd[k] && snd[k].stream) snd[k].stream.unlock();   // lets iPhones start them later
    gate.classList.add("go"); $("#mute").classList.add("show");
    cur = 0; go(1);
  };
  gate.addEventListener("click", enter);
  document.addEventListener("keydown", e => { if (!gate.classList.contains("go") && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); enter(); } });
}

/* ---------- controls ---------- */
$("#stage").addEventListener("click", e => {
  const x = e.clientX / innerWidth;
  if (x < 0.28) nav(-1); else nav(1);
});
document.addEventListener("keydown", e => {
  if (e.target.closest && e.target.closest("#mix")) { if (e.key === "Escape") toggleMixer(false); return; }
  if (e.key === "ArrowRight" || e.key === " " || e.key === "Enter" || e.key === "PageDown") { if ($("#gate").classList.contains("go")) { e.preventDefault(); nav(1); } }
  else if (e.key === "ArrowLeft" || e.key === "PageUp") nav(-1);
  else if (e.key === "m" || e.key === "M") toggleMixer();
  else if (e.key === "Escape") toggleMixer(false);
});
let tx = 0, ty = 0;
$("#stage").addEventListener("touchstart", e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
$("#stage").addEventListener("touchend", e => {
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) nav(dx < 0 ? 1 : -1);
}, { passive: true });
$("#mute").addEventListener("click", e => {
  e.stopPropagation(); muted = !muted; applyMaster(); e.target.textContent = muted ? "Sound off" : "Sound on";
});
$("#againLink").addEventListener("click", e => { e.preventDefault(); location.reload(); });

/* ---------- mixer: press M ---------- */
function buildMixer() {
  const box = $("#mix");
  const rows = ["master"].concat(Object.keys(SOUNDS)).map(k =>
    `<div class="row"><label for="mx_${k}">${k === "master" ? "Master" : LABELS[k]}</label>
     <input id="mx_${k}" type="range" min="-30" max="12" step="0.5" value="${trimDB[k] || 0}" data-k="${k}"><span class="db" id="db_${k}"></span></div>`).join("");
  const opts = STEPS.map((s, i) => `<option value="${i}">${i}. ${s.gate ? "gate" : s.end ? "end (black)" : s.video ? "market film" : (s.img ? [].concat(s.img)[0].replace(/^photos\//, "").replace(/\.jpg$/, "") : "")}</option>`).join("");
  box.innerHTML = `<h2>Mix (press M to close)</h2>${rows}<hr>
    <div class="row"><label for="mx_step">Jump to</label><select id="mx_step">${opts}</select><span></span></div>
    <div class="bar"><button id="mx_copy" type="button">Copy mix</button><button id="mx_reset" type="button">Reset</button></div>
    <small>Levels are in dB on top of your files. 0 = exactly as you made them. Jumping lets you listen to any moment; the page itself stays one-way after the market.</small>`;
  box.addEventListener("click", e => e.stopPropagation());
  box.querySelectorAll("input[type=range]").forEach(inp => {
    const paint = () => $("#db_" + inp.dataset.k).textContent = (+inp.value > 0 ? "+" : "") + inp.value;
    paint();
    inp.addEventListener("input", () => {
      const k = inp.dataset.k; trimDB[k] = +inp.value; paint();
      if (k === "master") applyMaster(); else if (bus[k]) bus[k].trim.gain.setTargetAtTime(db2g(trimDB[k]), ctx.currentTime, 0.05);
      try { localStorage.setItem("op_mix", JSON.stringify(trimDB)); } catch (e) {}
    });
  });
  $("#mx_step").addEventListener("change", e => go(+e.target.value, true));
  $("#mx_copy").addEventListener("click", async () => {
    const out = JSON.stringify(trimDB); try { await navigator.clipboard.writeText(out); $("#mx_copy").textContent = "Copied"; } catch (e) { prompt("Copy this:", out); }
    setTimeout(() => $("#mx_copy").textContent = "Copy mix", 1500);
  });
  $("#mx_reset").addEventListener("click", () => {
    for (const k in trimDB) trimDB[k] = k === "master" ? 0 : SOUNDS[k].trim;
    try { localStorage.removeItem("op_mix"); } catch (e) {}
    box.querySelectorAll("input[type=range]").forEach(inp => { inp.value = trimDB[inp.dataset.k]; inp.dispatchEvent(new Event("input")); });
  });
  if (new URLSearchParams(location.search).has("mix")) toggleMixer(true);
}
function toggleMixer(force) { const b = $("#mix"); b.classList.toggle("open", force === undefined ? !b.classList.contains("open") : force); }
function syncMixer() { const s = $("#mx_step"); if (s) s.value = cur; }

/* ---------- test hook (harmless) ---------- */
window.__op = {
  step: () => cur,
  go: (i) => go(i, true),
  levels: () => Object.fromEntries(Object.keys(SOUNDS).map(k => [k, +bus[k].level.gain.value.toFixed(4)])),
  targets: i => targets(i === undefined ? cur : i),
  rms: () => { const a = new Float32Array(analyser.fftSize); analyser.getFloatTimeDomainData(a); let s = 0; for (const v of a) s += v * v; return 20 * Math.log10(Math.sqrt(s / a.length) + 1e-9); },
  ctx: () => ctx && ctx.state
};

boot();
</script>
</body>
</html>
